$kind: http-request
url: "{{baseUrl}}/api/v1/user/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "alice",
      "password": "WrongPass1"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 3000
