$kind: http-request
url: "{{baseUrl}}/api/v1/user/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "bob@test.com",
      "password": "Passw0rdB"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('tokenB', j.token); }
    language: text/javascript
order: 2000
