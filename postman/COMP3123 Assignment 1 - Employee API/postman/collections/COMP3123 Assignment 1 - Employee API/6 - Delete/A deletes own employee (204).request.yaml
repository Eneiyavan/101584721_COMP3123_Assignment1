$kind: http-request
url: "{{baseUrl}}/api/v1/emp/employees?eid={{empA}}"
method: DELETE
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
queryParams:
  eid: "{{empA}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 204', function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 1000
