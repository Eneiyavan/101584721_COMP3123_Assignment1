$kind: http-request
url: "{{baseUrl}}/api/v1/emp/employees"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
body:
  type: json
  content: |-
    {
      "first_name": "First1",
      "last_name": "Last1",
      "email": "emp1@company.com",
      "position": "Developer",
      "salary": 65000,
      "date_of_joining": "2026-01-15",
      "department": "IT"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('empA', j.data._id); }
    language: text/javascript
order: 1000
