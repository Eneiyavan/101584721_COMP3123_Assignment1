$kind: http-request
url: "{{baseUrl}}/api/v1/emp/employees"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
body:
  type: json
  content: |-
    {
      "first_name": "First2",
      "last_name": "Last2",
      "email": "emp2@company.com",
      "position": "Developer",
      "salary": -100,
      "date_of_joining": "2026-01-15",
      "department": "IT"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
