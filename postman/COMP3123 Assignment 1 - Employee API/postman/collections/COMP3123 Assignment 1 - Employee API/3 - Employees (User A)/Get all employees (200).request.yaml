$kind: http-request
url: "{{baseUrl}}/api/v1/emp/employees"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 8000
