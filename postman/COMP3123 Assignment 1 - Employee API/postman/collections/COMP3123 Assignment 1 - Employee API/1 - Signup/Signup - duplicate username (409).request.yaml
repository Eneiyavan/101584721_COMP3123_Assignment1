$kind: http-request
url: "{{baseUrl}}/api/v1/user/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "alice",
      "email": "other@test.com",
      "password": "Passw0rdA"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 3000
