$kind: http-request
url: "{{baseUrl}}/api/v1/user/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "alice",
      "email": "alice@test.com",
      "password": "Passw0rdA"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
